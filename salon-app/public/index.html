<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salón de Ali</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%80</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFBF3;
    --ink: #5C4552;
    --ink-soft: #BBA2AC;
    --rose: #FF6FA0;
    --rose-deep: #E64980;
    --bow-red: #E4483E;
    --teal: #5FCBAE;
    --teal-bg: #E6F8F2;
    --coral: #FF9E80;
    --coral-bg: #FFEEE6;
    --violet: #B29AE8;
    --violet-bg: #F1ECFC;
    --gold: #F5B94F;
    --gold-bg: #FEF3DE;
    --surface: #FFF1F4;
    --surface-2: #FFFFFF;
    --line: #FCE3EA;
    --green: #4FBE8A;
    --green-bg: #E7F7EF;
    --red: #F0637A;
    --red-bg: #FDE8EC;
    --radius: 20px;
    --font-display: 'Jua', sans-serif;
    --font-body: 'Quicksand', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #251C16;
      --ink: #FBE9EF;
      --ink-soft: #CBA5B3;
      --surface: #2E241C;
      --surface-2: #2A2019;
      --line: #4E3D2F;
      --teal-bg: #163731;
      --coral-bg: #3B2418;
      --violet-bg: #2A2144;
      --gold-bg: #3A2C15;
      --green-bg: #1D3327;
      --red-bg: #3D2028;
    }
  }
  :root[data-theme="dark"] {
    --bg: #251C16;
    --ink: #FBE9EF;
    --ink-soft: #CBA5B3;
    --surface: #2E241C;
    --surface-2: #2A2019;
    --line: #4E3D2F;
    --teal-bg: #163731;
    --coral-bg: #3B2418;
    --violet-bg: #2A2144;
    --gold-bg: #3A2C15;
    --green-bg: #1D3327;
    --red-bg: #3D2028;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100%;
  }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 15px; }

  #app { display: flex; min-height: 100vh; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 230px;
    flex-shrink: 0;
    background: var(--surface-2);
    background-image: radial-gradient(var(--rose) 1px, transparent 1.6px);
    background-size: 26px 26px;
    background-position: -4px -4px;
    background-blend-mode: normal;
    position: relative;
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  .sidebar::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--surface-2);
    opacity: 0.93;
    pointer-events: none;
  }
  .sidebar > * { position: relative; z-index: 1; }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px;
  }
  .brand-bow { width: 22px; height: 22px; color: var(--bow-red); flex-shrink: 0; }
  .brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.01em;
  }
  .brand-sub {
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  nav.tabs { display: flex; flex-direction: column; gap: 2px; }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 11px;
    background: none;
    border: none;
    text-align: left;
    color: var(--ink-soft);
    padding: 10px 10px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 500;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .tab-btn:hover { background: var(--surface); color: var(--ink); }
  .tab-btn.active { background: var(--tab-color, var(--rose)); color: #fff; }
  .tab-emoji {
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
  }
  .sidebar-foot {
    margin-top: auto;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 6px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  /* ---- Main ---- */
  main {
    flex: 1;
    min-width: 0;
    padding: 34px 40px 60px;
  }
  .page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .page-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 4px;
  }
  .page-desc { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .search-wrap { margin-bottom: 18px; }
  .search-input {
    width: 100%;
    padding: 11px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface-2);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
  }
  .search-input:focus { outline: 2px solid var(--rose); outline-offset: 1px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--rose);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn:hover { background: var(--rose-deep); }
  .btn.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn.secondary:hover { background: var(--surface); }
  .btn.danger { background: var(--red); }
  .btn.danger:hover { background: #8a3a32; }
  .btn.small { padding: 6px 12px; font-size: 13px; }

  /* ---- Cards / grids ---- */
  .grid-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
  }
  .stat-label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; }
  .stat-value { font-family: var(--font-display); font-size: 26px; font-weight: 600; }
  .stat-value.pos { color: var(--green); }
  .stat-value.warn { color: var(--red); }
  .stat-value.teal { color: var(--teal); }
  .stat-value.coral { color: var(--coral); }
  .stat-value.violet { color: var(--violet); }

  .section-block { margin-bottom: 34px; }
  .section-block h3 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 14px;
  }

  .list-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .row-main { min-width: 0; }
  .row-title { font-weight: 600; font-size: 14.5px; }
  .row-sub { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .row-sub a { color: var(--rose-deep); text-decoration: none; font-weight: 600; }
  .row-sub a:hover { text-decoration: underline; }
  .thumb {
    width: 42px; height: 42px;
    border-radius: 14px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .thumb-wrap { display: inline-block; flex-shrink: 0; }
  .thumb-fallback {
    width: 42px; height: 42px;
    border-radius: 14px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--rose);
  }
  .thumb-fallback svg { width: 18px; height: 18px; }
  .thumb-preview {
    width: 64px; height: 64px;
    border-radius: 16px;
    object-fit: cover;
    border: 1px solid var(--line);
    margin-top: 8px;
  }
  .gallery-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0;
  }
  .gallery-thumb-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .gallery-thumb {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 14px;
    border: 1px solid var(--line);
  }
  .gallery-thumb-del {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    border: none;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .row-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    padding: 6px;
    border-radius: 8px;
    display: flex;
  }
  .icon-btn:hover { background: var(--surface); color: var(--ink); }
  .icon-btn svg { width: 16px; height: 16px; }

  .pill {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
    background: var(--surface);
    color: var(--ink-soft);
  }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.gold { background: var(--gold-bg); color: var(--gold); }
  .pill.teal { background: var(--teal-bg); color: var(--teal); }
  .pill.violet { background: var(--violet-bg); color: var(--violet); }
  .pill.coral { background: var(--coral-bg); color: var(--coral); }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .empty .btn { margin-top: 14px; }

  /* ---- Modal ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(42, 27, 24, 0.4);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay[hidden] { display: none; }
  .modal {
    background: var(--surface-2);
    border-radius: 16px;
    width: 100%;
    max-width: 440px;
    max-height: 86vh;
    overflow-y: auto;
    padding: 26px;
  }
  .modal h3 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 18px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg);
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input[type="file"] {
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }

  /* ---- Chart bars ---- */
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 130px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; max-width: 30px; background: var(--rose); border-radius: 5px 5px 0 0; min-height: 3px; }
  .bar-label { font-size: 10.5px; color: var(--ink-soft); }

  .dedication-wrap {
    position: relative;
    margin: 4px 0 34px;
    max-width: 580px;
    padding: 6px 0 6px 54px;
  }
  .dedication-mark {
    position: absolute;
    left: -2px;
    top: -6px;
    width: 40px;
    height: 40px;
    color: var(--rose);
    opacity: 0.9;
    user-select: none;
  }
  .dedication {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 19px;
    line-height: 1.55;
    color: var(--rose-deep);
    margin: 0;
  }
  .dedication-rule {
    width: 46px;
    height: 3px;
    border-radius: 2px;
    margin-top: 14px;
    background: linear-gradient(90deg, var(--rose), var(--violet) 50%, var(--coral));
  }

  .loading-note { color: var(--ink-soft); font-size: 13px; padding: 20px 0; }

  /* ---- Mobile ---- */
  .mobile-topbar { display: none; }
  .bottom-tabs { display: none; }
  @media (max-width: 820px) {
    #app { flex-direction: column; }
    .sidebar {
      display: none;
    }
    .mobile-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    main { padding: 22px 16px 90px; }
    .bottom-tabs {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      background: var(--surface-2);
      border-top: 1px solid var(--line);
      padding: 6px 4px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
      z-index: 30;
    }
    .bottom-tabs .tab-btn {
      flex: 1;
      flex-direction: column;
      font-size: 10.5px;
      gap: 4px;
      align-items: center;
      border-radius: 10px;
      padding: 6px 2px;
    }
    .bottom-tabs .tab-btn.active { background: var(--surface); color: var(--tab-color, var(--rose-deep)); }
  }
</style>
</head>
<body>
<div id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-bow" viewBox="0 0 24 24" fill="currentColor">
        <path d="M11 12C11 12 3 6.8 2 7.8 1 8.8 1 15.2 2 16.2 3 17.2 11 12 11 12Z"/>
        <path d="M13 12C13 12 21 6.8 22 7.8 23 8.8 23 15.2 22 16.2 21 17.2 13 12 13 12Z"/>
        <rect x="10.2" y="9.8" width="3.6" height="4.4" rx="1.2"/>
      </svg>
      <div class="brand-text">
        <div class="brand-name" id="brandNameSide">Mi Salón</div>
        <div class="brand-sub" id="brandSubSide">Gestión del negocio</div>
      </div>
    </div>
    <nav class="tabs" id="navTabs"></nav>
    <div class="sidebar-foot">
      Hecho con cariño para ti 💅
      <button id="logoutBtn" style="display:block; margin-top:10px; background:none; border:none; color:var(--ink-soft); font-family:inherit; font-size:12px; text-decoration:underline; cursor:pointer; padding:0;">Cerrar sesión</button>
    </div>
  </aside>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">
    <div class="mobile-topbar">
      <div class="brand-name" style="font-size:19px" id="brandNameTop">Mi Salón</div>
    </div>
    <main id="main"></main>
  </div>

  <nav class="bottom-tabs" id="bottomTabs"></nav>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ============================================================
   Estado y persistencia (API propia + PostgreSQL)
   ============================================================ */
const API = '/api';
let STATE = {
  clients: [],
  services: [],
  appointments: [],
  inventory: [],
  transactions: []
};
let currentTab = 'inicio';
let dbReady = false;

const TABS = [
  { id: 'inicio', label: 'Inicio', emoji: '🎀', color: 'var(--rose)' },
  { id: 'agenda', label: 'Agenda', emoji: '📅', color: 'var(--teal)' },
  { id: 'clientas', label: 'Clientas', emoji: '💗', color: 'var(--coral)' },
  { id: 'servicios', label: 'Servicios', emoji: '💅', color: 'var(--violet)' },
  { id: 'inventario', label: 'Inventario', emoji: '🎁', color: 'var(--gold)' },
  { id: 'finanzas', label: 'Finanzas', emoji: '💰', color: 'var(--green)' },
];

function money(n) { return (Number(n) || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' }); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function monthKey(d) { return (d || todayStr()).slice(0, 7); }

async function apiGet(pathname) {
  const r = await fetch(API + pathname);
  if (r.status === 401) { window.location.href = '/login.html'; throw new Error('No autorizado'); }
  if (!r.ok) throw new Error('GET ' + pathname + ' failed');
  return r.json();
}
async function apiSend(pathname, method, body) {
  const r = await fetch(API + pathname, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { window.location.href = '/login.html'; throw new Error('No autorizado'); }
  if (!r.ok) throw new Error(method + ' ' + pathname + ' failed (HTTP ' + r.status + ')');
  if (r.status === 204) return null;
  return r.json();
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
  window.location.href = '/login.html';
});

async function initDB() {
  dbReady = false;
  render();
  try {
    const [clients, services, appointments, inventory, transactions] = await Promise.all([
      apiGet('/clients'),
      apiGet('/services'),
      apiGet('/appointments'),
      apiGet('/inventory'),
      apiGet('/transactions'),
    ]);
    STATE.clients = clients;
    STATE.services = services;
    STATE.appointments = appointments;
    STATE.inventory = inventory;
    STATE.transactions = transactions;
  } catch (e) {
    console.error('No se pudo conectar con la API:', e);
  }
  dbReady = true;
  render();
}

async function addDoc(col, data) {
  try {
    const created = await apiSend('/' + col, 'POST', data);
    STATE[col].push(created);
  } catch (e) { console.error('No se pudo guardar en ' + col + ':', e); }
  render();
}
async function updateDoc(col, id, data) {
  try {
    const updated = await apiSend('/' + col + '/' + id, 'PUT', data);
    const i = STATE[col].findIndex(x => x.id === id);
    if (i > -1) STATE[col][i] = updated;
  } catch (e) { console.error('No se pudo actualizar en ' + col + ':', e); }
  render();
}
async function deleteDoc(col, id) {
  try {
    await apiSend('/' + col + '/' + id, 'DELETE');
    STATE[col] = STATE[col].filter(x => x.id !== id);
  } catch (e) { console.error('No se pudo eliminar en ' + col + ':', e); }
  render();
}

/* ============================================================
   Iconos (líneas simples)
   ============================================================ */
function icoHome(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1v-9"/></svg>`}
function icoCal(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>`}
function icoUsers(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.7-3.4 3-5.2 5.5-5.2s4.8 1.8 5.5 5.2"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.8 13.4c2 .3 3.6 2 4.2 4.9"/></svg>`}
function icoSpark(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M5 12H3M21 12h-2M6.5 6.5 5 5M19 19l-1.5-1.5M6.5 17.5 5 19M19 5l-1.5 1.5"/><circle cx="12" cy="12" r="3.4"/></svg>`}
function icoBox(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8 12 4l8.5 4-8.5 4-8.5-4Z"/><path d="M3.5 8v8L12 20l8.5-4V8"/><path d="M12 12v8"/></svg>`}
function icoChart(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M3 20h18"/></svg>`}
function icoHeart(){return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.4-4.6-10-9.3C.4 8 1.6 4.6 4.8 3.7c2-.6 4 .2 5.2 2 .3.4.6.9.8 1.3.6-1.4 1.7-2.6 3.2-3 3.2-1 5.6 1.5 6.6 3.9.8 2-.2 4.4-1.4 6.1-2 2.8-5.3 5.2-7.2 6.5Z"/></svg>`}

function thumbHtml(url) {

    <img class="thumb" src="${escAttr(url)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="thumb-fallback" style="display:none;">${icoHeart()}</div>

}
function icoPlus(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`}
function icoEdit(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-3l-1-1a2 2 0 0 0-3 0L4 15v5Z"/></svg>`}
function icoTrash(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M9 6.5V4.8c0-.7.6-1.3 1.3-1.3h3.4c.7 0 1.3.6 1.3 1.3v1.7M7 6.5l.7 12.3a1.5 1.5 0 0 0 1.5 1.4h5.6a1.5 1.5 0 0 0 1.5-1.4l.7-12.3"/></svg>`}

/* ============================================================
   Navegación
   ============================================================ */
function renderNav() {
  const navHtml = TABS.map(t => `
    <button class="tab-btn ${currentTab===t.id?'active':''}" data-tab="${t.id}" style="--tab-color:${t.color}">
      <span class="tab-emoji">${t.emoji}</span> <span>${t.label}</span>
    </button>`).join('');
  document.getElementById('navTabs').innerHTML = navHtml;
  document.getElementById('bottomTabs').innerHTML = navHtml;
  document.querySelectorAll('[data-tab]').forEach(b => {
    b.addEventListener('click', () => { currentTab = b.dataset.tab; render(); });
  });
  document.getElementById('brandNameSide').textContent = 'Salón de Ali';
  document.getElementById('brandNameTop').textContent = 'Salón de Ali';
  document.getElementById('brandSubSide').textContent = 'Por Alicia';
}

/* ============================================================
   Render principal
   ============================================================ */
function render() {
  renderNav();
  const main = document.getElementById('main');
  if (!dbReady) {
    main.innerHTML = `<div class="loading-note">Cargando tu salón…</div>`;
    return;
  }
  if (currentTab === 'inicio') main.innerHTML = viewInicio();
  if (currentTab === 'agenda') main.innerHTML = viewAgenda();
  if (currentTab === 'clientas') main.innerHTML = viewClientas();
  if (currentTab === 'servicios') main.innerHTML = viewServicios();
  if (currentTab === 'inventario') main.innerHTML = viewInventario();
  if (currentTab === 'finanzas') main.innerHTML = viewFinanzas();
  attachHandlers();
}

/* ---------------- Frase del día ---------------- */
const DAILY_PHRASES = [
  'Cada clienta que agendas, cada diseño que perfeccionas, cada euro que guardas: esto ya no es solo un sueño, es tu negocio.',
  'Cada esmalte que aplicas es un pedacito de arte que alguien va a llevar con orgullo.',
  'Hoy también estás construyendo algo tuyo, con tus propias manos.',
  'Un negocio no se hace en un día, se hace cita por cita, como este.',
  'Cada clienta que confía en ti es una prueba de lo bien que haces las cosas.',
  'Eres la dueña de tu tiempo y de tu talento.',
  'Detrás de cada diseño hay horas de práctica que nadie ve, pero que se notan.',
  'Este espacio es tuyo: cuídalo, hazlo crecer, disfrútalo.',
  'No hay negocio pequeño cuando se hace con tanto cariño.',
  'Cada euro que entra aquí es el resultado de tu esfuerzo, no lo olvides.',
  'Hoy es un buen día para seguir construyendo tu sueño.',
  'Tus manos crean belleza, y tu cabeza organiza un negocio de verdad.',
  'Sigue así: constancia, cariño y buen gusto, la combinación perfecta.',
  'Cada clienta se va más bonita, y tú te vas más cerca de tu meta.',
  'Este es solo el comienzo de algo grande.',
  'Nada de esto sería posible sin tu dedicación diaria.',
  'Hoy también vas a hacer que alguien se sienta especial.',
  'El talento sin organización es potencial desperdiciado, y tú tienes ambos.',
  'Sigue creando, sigue cobrando lo que vales.',
  'Un salón bonito empieza con una persona con visión, esa eres tú.',
  'Con amor y cariño, tu novio bonito 💗',
];
function dailyPhrase() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return DAILY_PHRASES[dayOfYear % DAILY_PHRASES.length];
}

function rowAppointment(a) {
  const client = STATE.clients.find(c => c.id === a.clientId);
  const service = STATE.services.find(s => s.id === a.serviceId);

  return `

        <div class="row-title">${a.time ? esc(a.time)+' · ' : ''}${esc(client ? client.name : (a.clientName||'Clienta'))}</div>

        <button class="icon-btn" data-edit-appt="${a.id}">${icoEdit()}</button>

}

/* ---------------- Agenda ---------------- */
function viewAgenda() {
  const sorted = [...STATE.appointments].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

/* ---------------- Clientas ---------------- */
let clientSearchTerm = '';

function viewClientas() {
  return `
    <div class="page-head">
      <div><h1 class="page-title">Clientas</h1><p class="page-desc">Sus datos, notas y preferencias.</p></div>
      <button class="btn" data-open="client-new">${icoPlus()} Nueva clienta</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="clientSearch" class="search-input" placeholder="🔍 Buscar por nombre, teléfono o Instagram…" value="${escAttr(clientSearchTerm)}" oninput="onClientSearchInput(this.value)">
    </div>
    <div id="clientasListArea">${renderClientasList()}</div>
  `;
}

function matchesClientSearch(c, term) {
  return (c.name||'').toLowerCase().includes(term)
    || (c.phone||'').toLowerCase().includes(term)
    || (c.instagram||'').toLowerCase().includes(term);
}

function clientRowHtml(c) {
  return `
      <div class="row">
        <div class="row-left">
          ${thumbHtml(c.imageUrl)}
          <div class="row-main">
            <div class="row-title">${esc(c.name)}</div>
            <div class="row-sub">${[esc(c.phone), c.instagram ? `<a href="https://instagram.com/${encodeURIComponent(c.instagram.replace('@',''))}" target="_blank" rel="noopener">@${esc(c.instagram.replace('@',''))}</a>` : '', esc(c.notes)].filter(Boolean).join(' · ')}</div>
          </div>
        </div>
        <div class="row-actions">
          ${(c.images||[]).length ? `<span class="pill violet">📷 ${c.images.length}</span>` : ''}
          <button class="icon-btn" data-edit-client="${c.id}">${icoEdit()}</button>
          <button class="icon-btn" data-del="clients:${c.id}">${icoTrash()}</button>
        </div>
      </div>`;
}

function renderClientasList() {
  const term = clientSearchTerm.trim().toLowerCase();
  const list = [...STATE.clients]
    .filter(c => !term || matchesClientSearch(c, term))
    .sort((a,b)=> (a.name||'').localeCompare(b.name||''));

  if (list.length) return `<div class="list-card">${list.map(clientRowHtml).join('')}</div>`;
  if (term) return `<div class="list-card"><div class="empty">🔍 No hay clientas que coincidan con "${esc(clientSearchTerm)}".</div></div>`;
  return `<div class="list-card"><div class="empty">💗 Todavía no hay clientas.<br><button class="btn small" data-open="client-new">${icoPlus()} Añadir la primera</button></div></div>`;
}

function onClientSearchInput(value) {
  clientSearchTerm = value;
  const area = document.getElementById('clientasListArea');
  area.innerHTML = renderClientasList();
  wireClientasListHandlers();
}

function wireClientasListHandlers() {
  const area = document.getElementById('clientasListArea');
  if (!area) return;
  area.querySelectorAll('[data-edit-client]').forEach(b => {
    b.addEventListener('click', () => {
      const c = STATE.clients.find(x => x.id === b.dataset.editClient);
      openModal(formClient(c));
      wireModalSave('client-edit', c.id);
    });
  });
  area.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => {
      const [col, id] = b.dataset.del.split(':');
      deleteDoc(col, id);
    });
  });
  area.querySelectorAll('[data-open="client-new"]').forEach(b => {
    b.addEventListener('click', () => {
      openModal(formClient());
      wireModalSave('client-new');
    });
  });
}

/* ---------------- Finanzas ---------------- */
function viewFinanzas() {
  const list = [...STATE.transactions].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const months = [];
  const now = new Date();
  for (let i=5;i>=0;i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.toISOString().slice(0,7));
  }
  const byMonth = months.map(m => {
    const tx = STATE.transactions.filter(t => monthKey(t.date)===m);
    const inc = tx.filter(t=>t.type==='ingreso').reduce((s,t)=>s+Number(t.amount||0),0);
    const exp = tx.filter(t=>t.type==='gasto').reduce((s,t)=>s+Number(t.amount||0),0);
    return { m, net: inc-exp };
  });
  const maxAbs = Math.max(1, ...byMonth.map(x=>Math.abs(x.net)));

  const mk = monthKey();
  const monthTx = STATE.transactions.filter(t => monthKey(t.date) === mk);
  const income = monthTx.filter(t=>t.type==='ingreso').reduce((s,t)=>s+Number(t.amount||0),0);
  const expense = monthTx.filter(t=>t.type==='gasto').reduce((s,t)=>s+Number(t.amount||0),0);

  return `
    <div class="page-head">
      <div><h1 class="page-title">Finanzas</h1><p class="page-desc">Ingresos y gastos del salón.</p></div>
      <button class="btn" data-open="tx-new">${icoPlus()} Nuevo movimiento</button>
    </div>

    <div class="grid-stats">
      <div class="stat-card"><div class="stat-label">Ingresos este mes</div><div class="stat-value pos">${money(income)}</div></div>
      <div class="stat-card"><div class="stat-label">Gastos este mes</div><div class="stat-value coral">${money(expense)}</div></div>
      <div class="stat-card"><div class="stat-label">Balance neto</div><div class="stat-value ${income-expense>=0?'pos':'warn'}">${money(income-expense)}</div></div>
    </div>

    <div class="section-block">
      <h3>Balance mensual</h3>
      <div class="list-card" style="padding:16px 18px;">
        <div class="bars">
          ${byMonth.map(x => {
            const h = Math.max(4, Math.round((Math.abs(x.net)/maxAbs)*100));
            const color = x.net>=0 ? 'var(--green)' : 'var(--red)';
            return `<div class="bar-col"><div class="bar" style="height:${h}px; background:${color}"></div><div class="bar-label">${x.m.slice(5)}</div></div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="section-block">
      <h3>Movimientos</h3>
      ${list.length ? `<div class="list-card">${list.map(t => `
        <div class="row">
          <div class="row-main">
            <div class="row-title">${esc(t.concept||'')}</div>
            <div class="row-sub">${formatDate(t.date)}</div>
          </div>
          <div class="row-actions">
            <span class="pill ${t.type==='ingreso'?'green':'red'}">${t.type==='ingreso'?'+':'-'}${money(t.amount)}</span>
            <button class="icon-btn" data-del="transactions:${t.id}">${icoTrash()}</button>
          </div>
        </div>`).join('')}</div>`
        : `<div class="list-card"><div class="empty">💰 Sin movimientos todavía.</div></div>`}
    </div>
  `;
}

    </div>`;
}

/* Redimensiona y convierte cualquier foto a JPG, para que siempre se pueda mostrar y pese poco */
function resizeImageFile(file, maxDim, quality) {
  maxDim = maxDim || 900;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Formato de imagen no compatible'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleImageFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const dataUrl = await resizeImageFile(file);
    document.getElementById('f-image').value = dataUrl;
    const img = document.getElementById('f-image-preview');
    img.src = dataUrl;
    img.style.display = 'block';
  } catch (err) {
    console.error('No se pudo procesar la foto:', err);
    alert('No se pudo procesar esa foto. Prueba con otra (JPG o PNG funcionan siempre).');
  }
  e.target.value = '';
}

/* ---- Galería de varias fotos (collage) ---- */
function galleryField(fieldId, label, hint, images) {
  const imgs = images || [];
  return `
    <div class="field">
      <label>${label}</label>
      <div class="gallery-grid" id="${fieldId}-grid">${imgs.map((src,i)=>galleryThumb(fieldId,src,i)).join('')}</div>
      <input type="file" accept="image/*" multiple id="${fieldId}-file" onchange="handleGalleryFiles(event, '${fieldId}')">
      <input type="hidden" id="${fieldId}" value='${escAttr(JSON.stringify(imgs))}'>
      <p style="font-size:11.5px; color:var(--ink-soft); margin:6px 0 0;">${hint} — se optimizan solas al subirlas</p>
    </div>`;
}
function galleryThumb(fieldId, src, i) {
  return `<div class="gallery-thumb-wrap">
    <img class="gallery-thumb" src="${escAttr(src)}">
    <button type="button" class="gallery-thumb-del" onclick="removeGalleryImage('${fieldId}', ${i})">×</button>
  </div>`;
}
function getGalleryImages(fieldId) {
  try { return JSON.parse(document.getElementById(fieldId).value || '[]'); } catch (e) { return []; }
}
function setGalleryImages(fieldId, arr) {
  document.getElementById(fieldId).value = JSON.stringify(arr);
  document.getElementById(fieldId + '-grid').innerHTML = arr.map((src,i)=>galleryThumb(fieldId,src,i)).join('');
}
async function handleGalleryFiles(e, fieldId) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const current = getGalleryImages(fieldId);
  const results = await Promise.allSettled(files.map(f => resizeImageFile(f)));
  let failed = 0;
  results.forEach(r => {
    if (r.status === 'fulfilled') current.push(r.value);
    else { failed++; console.error('No se pudo procesar una foto:', r.reason); }
  });
  setGalleryImages(fieldId, current);
  if (failed) alert(failed + ' foto(s) no se pudieron procesar. Prueba con JPG o PNG.');
  e.target.value = '';
}
function removeGalleryImage(fieldId, index) {
  const current = getGalleryImages(fieldId);
  current.splice(index, 1);
  setGalleryImages(fieldId, current);
}

function formService(existing) {
  const s = existing || {};
  return `
    <h3>${existing ? 'Editar servicio' : 'Nuevo servicio'}</h3>
    <div class="field"><label>Nombre</label><input id="f-name" value="${escAttr(s.name)}"></div>
    <div class="field-row">
      <div class="field"><label>Precio (€)</label><input type="number" step="0.5" id="f-price" value="${s.price!=null?s.price:''}"></div>
      <div class="field"><label>Duración (min)</label><input type="number" id="f-duration" value="${s.duration!=null?s.duration:''}"></div>
    </div>
    ${imageField(s.imageUrl)}
    <div class="modal-actions">
      <button class="btn secondary" data-close>Cancelar</button>
      <button class="btn" id="saveService">${existing?'Guardar':'Crear servicio'}</button>
    </div>
  `;
}

function formItem(existing) {
  const i = existing || {};
  return `
    <h3>${existing ? 'Editar producto' : 'Nuevo producto'}</h3>
    <div class="field"><label>Nombre</label><input id="f-name" value="${escAttr(i.name)}"></div>
    <div class="field-row">
      <div class="field"><label>Cantidad actual</label><input type="number" id="f-qty" value="${i.qty!=null?i.qty:''}"></div>
      <div class="field"><label>Mínimo antes de avisar</label><input type="number" id="f-minqty" value="${i.minQty!=null?i.minQty:''}"></div>
    </div>
    <div class="field"><label>Unidad</label><input id="f-unit" value="${escAttr(i.unit||'uds')}"></div>
    ${imageField(i.imageUrl)}
    <div class="modal-actions">
      <button class="btn secondary" data-close>Cancelar</button>
      <button class="btn" id="saveItem">${existing?'Guardar':'Crear producto'}</button>
    </div>
  `;
}

function formTx() {
  return `
    <h3>Nuevo movimiento</h3>
    <div class="field"><label>Tipo</label>
      <select id="f-type"><option value="ingreso">Ingreso</option><option value="gasto">Gasto</option></select>
    </div>
    <div class="field"><label>Concepto</label><input id="f-concept" placeholder="Ej: Manicura de Laura"></div>
    <div class="field-row">
      <div class="field"><label>Importe (€)</label><input type="number" step="0.5" id="f-amount"></div>
      <div class="field"><label>Fecha</label><input type="date" id="f-date" value="${todayStr()}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" data-close>Cancelar</button>
      <button class="btn" id="saveTx">Guardar</button>
    </div>
  `;
}

/* ============================================================
   Handlers
   ============================================================ */
function attachHandlers() {
  document.querySelectorAll('[data-open]').forEach(b => {
    b.addEventListener('click', () => {
      const kind = b.dataset.open;
      if (kind === 'appt-new') openModal(formAppointment());
      if (kind === 'client-new') openModal(formClient());
      if (kind === 'service-new') openModal(formService());
      if (kind === 'item-new') openModal(formItem());
      if (kind === 'tx-new') openModal(formTx());
      wireModalSave(kind);
    });
  });

  document.querySelectorAll('[data-edit-appt]').forEach(b => {
    b.addEventListener('click', () => {
      const a = STATE.appointments.find(x => x.id === b.dataset.editAppt);
      openModal(formAppointment(a));
      wireModalSave('appt-edit', a.id);
    });
  });
  document.querySelectorAll('[data-edit-client]').forEach(b => {
    b.addEventListener('click', () => {
      const c = STATE.clients.find(x => x.id === b.dataset.editClient);
      openModal(formClient(c));
      wireModalSave('client-edit', c.id);
    });
  });
  document.querySelectorAll('[data-edit-service]').forEach(b => {
    b.addEventListener('click', () => {
      const s = STATE.services.find(x => x.id === b.dataset.editService);
      openModal(formService(s));
      wireModalSave('service-edit', s.id);
    });
  });
  document.querySelectorAll('[data-edit-item]').forEach(b => {
    b.addEventListener('click', () => {
      const i = STATE.inventory.find(x => x.id === b.dataset.editItem);
      openModal(formItem(i));
      wireModalSave('item-edit', i.id);
    });
  });

  document.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => {
      const [col, id] = b.dataset.del.split(':');
      deleteDoc(col, id);
    });
  });
}

function wireModalSave(kind, editId) {
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));

  if (kind === 'appt-new' || kind === 'appt-edit') {
    document.getElementById('saveAppt').addEventListener('click', () => {
      const data = {
        date: document.getElementById('f-date').value || todayStr(),
        time: document.getElementById('f-time').value,
        clientId: document.getElementById('f-client').value,
        serviceId: document.getElementById('f-service').value,
        notes: document.getElementById('f-notes').value.trim(),
        images: getGalleryImages('f-gallery'),
      };
      if (kind === 'appt-edit') updateDoc('appointments', editId, data);
      else addDoc('appointments', data);
      closeModal();
    });
  }
  if (kind === 'client-new' || kind === 'client-edit') {
    document.getElementById('saveClient').addEventListener('click', () => {
      const name = document.getElementById('f-name').value.trim();
      if (!name) return;
      const data = {
        name,
        phone: document.getElementById('f-phone').value.trim(),
        instagram: document.getElementById('f-instagram').value.trim().replace('@',''),
        imageUrl: document.getElementById('f-image').value.trim(),
        images: getGalleryImages('f-gallery'),
        notes: document.getElementById('f-notes').value.trim(),
      };
      if (kind === 'client-edit') updateDoc('clients', editId, data);
      else addDoc('clients', data);
      closeModal();
    });
  }
  if (kind === 'service-new' || kind === 'service-edit') {
    document.getElementById('saveService').addEventListener('click', () => {
      const name = document.getElementById('f-name').value.trim();
      if (!name) return;
      const data = { name, price: Number(document.getElementById('f-price').value)||0, duration: Number(document.getElementById('f-duration').value)||0, imageUrl: document.getElementById('f-image').value.trim() };
      if (kind === 'service-edit') updateDoc('services', editId, data);
      else addDoc('services', data);
      closeModal();
    });
  }
  if (kind === 'item-new' || kind === 'item-edit') {
    document.getElementById('saveItem').addEventListener('click', () => {
      const name = document.getElementById('f-name').value.trim();
      if (!name) return;
      const data = {
        name,
        qty: Number(document.getElementById('f-qty').value)||0,
        minQty: Number(document.getElementById('f-minqty').value)||0,
        unit: document.getElementById('f-unit').value.trim() || 'uds',
        imageUrl: document.getElementById('f-image').value.trim(),
      };
      if (kind === 'item-edit') updateDoc('inventory', editId, data);
      else addDoc('inventory', data);
      closeModal();
    });
  }
  if (kind === 'tx-new') {
    document.getElementById('saveTx').addEventListener('click', () => {
      const amount = Number(document.getElementById('f-amount').value);
      if (!amount) return;
      const data = {
        type: document.getElementById('f-type').value,
        concept: document.getElementById('f-concept').value.trim(),
        amount,
        date: document.getElementById('f-date').value || todayStr(),
      };
      addDoc('transactions', data);
      closeModal();
    });
  }
}

/* ============================================================
   Utilidades
   ============================================================ */
function esc(s) { return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }
function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}

document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeModal(); });

render();
initDB();
</script>
